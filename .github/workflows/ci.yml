name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned rather than ubuntu-latest: the blueprint fixes the performance gate
    # to this image and asks for an amendment before the runner changes, so the
    # correctness gate is measured on the same machine those numbers assume.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # node:sqlite is only available without an experimental flag from 22.16,
      # which is what engines demands; the archive also needs its FTS5 build.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify
